<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>{{TITLE}}</title>
	<meta name="description" content="{{DESCRIPTION}}">
	<meta name="theme-color" content="#4d4747">
	<link rel="canonical" href="https://www.mtelnetworks.com/">

	<!-- Open Graph / Social Sharing -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.mtelnetworks.com/">
	<meta property="og:title" content="{{TITLE}}">
	<meta property="og:description" content="{{DESCRIPTION}}">
	<meta property="og:image" content="https://www.mtelnetworks.com/assets/images/logo-with-tagline.png">
	<meta property="og:locale" content="en_IN">
	<meta property="og:site_name" content="M-Tel Networks">

	<!-- Twitter Cards -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{TITLE}}">
	<meta name="twitter:description" content="{{DESCRIPTION}}">
	<meta name="twitter:image" content="https://www.mtelnetworks.com/assets/images/logo-with-tagline.png">

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="assets/images/logo-with-tagline.png">

	<!-- Preload Essential Fonts -->
	<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>

	<!-- Stylesheet -->
	<link rel="stylesheet" href="assets/css/styles.css">

	<!-- Structured Data (JSON-LD) for LocalBusiness & ISP -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": ["InternetServiceProvider", "LocalBusiness"],
		"name": "M-Tel Networks (P) Ltd",
		"alternateName": "M-Tel Networks",
		"url": "https://www.mtelnetworks.com/",
		"logo": "https://www.mtelnetworks.com/assets/images/logo-with-tagline.png",
		"telephone": "+91-7373710071",
		"email": "md@mtelnetworks.com",
		"description": "Leading technology-driven Internet Service Provider (ISP) providing Fibernet, Leased Lines, and Wireless broadband across Coimbatore and Tamil Nadu.",
		"foundingDate": "2013",
		"address": {
			"@type": "PostalAddress",
			"addressLocality": "Coimbatore",
			"addressRegion": "Tamil Nadu",
			"addressCountry": "IN"
		},
		"geo": {
			"@type": "GeoCoordinates",
			"latitude": "11.011677",
			"longitude": "76.827148"
		},
		"areaServed": [
			"Coimbatore",
			"Tirupur",
			"Erode",
			"Pollachi",
			"Tamil Nadu"
		],
		"openingHoursSpecification": {
			"@type": "OpeningHoursSpecification",
			"dayOfWeek": [
				"Monday",
				"Tuesday",
				"Wednesday",
				"Thursday",
				"Friday",
				"Saturday",
				"Sunday"
			],
			"opens": "00:00",
			"closes": "23:59"
		}
	}
	</script>

	<!-- Scripts -->
	<script src="assets/js/search-index.js" defer></script>
	<script src="assets/js/main.js" defer></script>
</head>
