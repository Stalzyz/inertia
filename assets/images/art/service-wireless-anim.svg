<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-hidden="true" focusable="false">
  <rect width="400" height="400" rx="32" fill="#FFF7F7"/>
  <g fill="none" stroke="#4D4747" stroke-width="2" opacity=".65">
    <circle cx="200" cy="200" r="112"/>
    <circle cx="200" cy="200" r="78"/>
    <circle cx="200" cy="200" r="44"/>
  </g>
  <g fill="none" stroke="#D82424" stroke-width="2">
    <circle cx="200" cy="200" r="20">
      <animate attributeName="r" values="20;132" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="20">
      <animate attributeName="r" values="20;132" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="200" cy="200" r="9" fill="#D82424">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
